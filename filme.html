<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de detalhes do filme ou série">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Laila:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>CineMatch - Detalhes do filme</title>
</head>

<body>

<!--Mesmo cabeçalho da Home, para manter a navegação consistente-->
<header>
    <a href="index.html" class="logo-link">
        <h1 class="logo laila-bold">CineMatch</h1>
    </a>
    <p class="slogan">Chega de rolar: Descubra. Vote. Assista.</p>

    <nav class="desktop-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">Ranking</a></li>
            <li><a href="#">Quiz</a></li>
            <li><a href="#">Chat IA</a></li>
        </ul>
    </nav>

    <div class="search-bar">
        <span class="material-symbols-outlined">search</span>
        <input type="text" placeholder="Buscar por filme ou série...">
    </div>

    <a href="perfil.html" class="avatar-link">
        <img class="avatar" src="assets/imgs/foto-perfil.jpg" alt="Foto de perfil do usuário">
    </a>
</header>

<div class="linha-horizontal">
    <hr>
</div>

<!--Seção principal: pôster + informações do filme-->
<section class="detalhe-filme">

    <img id="detalhe-poster" src="" alt="Pôster do filme" class="poster-detalhe">

    <div class="info-detalhe">

        <h2 id="detalhe-titulo"></h2>

        <p id="detalhe-meta"></p>
        <!--Vai receber algo como "2019 · Drama · 2h12min"-->

        <div class="avaliacao">
            <span id="detalhe-estrelas"></span>
            <!--As 5 estrelinhas vão ser montadas aqui pelo JavaScript-->
            <span class="nota" id="detalhe-nota"></span>
            <span class="votos" id="detalhe-votos"></span>
        </div>

        <div class="acoes-detalhe">
            <button class="botao-favoritos">+ Favoritos</button>
            <button class="botao-votar">↑ Votar</button>
        </div>

        <p id="detalhe-sinopse" class="sinopse"></p>

        <h3>Onde assistir</h3>
        <div class="plataformas" id="detalhe-plataformas">
            <!--As plataformas (Prime Video, Max...) vão ser montadas aqui-->
        </div>

        <h3>Reviews da comunidade</h3>
        <div class="reviews" id="detalhe-reviews">
            <!--Os comentários dos usuários vão ser montados aqui-->
        </div>

    </div>

</section>

<nav class="mobile-nav">
    <a href="index.html"><span>🏠</span>Home</a>
    <a href="#"><span>🏆</span>Ranking</a>
    <a href="#"><span>❓</span>Quiz</a>
    <a href="#"><span>🗨️</span>Chat IA</a>
    <a href="perfil.html"><span>👤</span>Perfil</a>
</nav>

<script src="filmes.js"></script>
<script src="filme.js"></script>

</body>
</html>
