<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resultados da busca por filmes e séries">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Laila:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>CineMatch - Resultados da busca</title>
</head>

<body>

<!--Mesmo cabeçalho das outras páginas-->
<header>
    <a href="index.html" class="logo-link">
        <h1 class="logo laila-bold">CineMatch</h1>
    </a>
    <p class="slogan">Chega de rolar: Descubra. Vote. Assista.</p>

    <nav class="desktop-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">Ranking</a></li>
            <li><a href="#">Quiz</a></li>
            <li><a href="#">Chat IA</a></li>
        </ul>
    </nav>

    <form class="search-bar" action="resultados.html" method="GET">
        <button type="submit" class="search-icon-btn" aria-label="Buscar">
            <span class="material-symbols-outlined">search</span>
        </button>
        <input type="text" name="q" placeholder="Buscar por filme ou série..." required>
    </form>

    <a href="perfil.html" class="avatar-link">
        <img class="avatar" src="assets/imgs/foto-perfil.jpg" alt="Foto de perfil do usuário">
    </a>
</header>

<div class="linha-horizontal">
    <hr>
</div>

<section class="resultados">
    <h2 id="resultados-titulo">Buscando...</h2>
    <div class="resultados-grid" id="resultados-grid"></div>
</section>

<nav class="mobile-nav">
    <a href="index.html"><span>🏠</span>Home</a>
    <a href="#"><span>🏆</span>Ranking</a>
    <a href="#"><span>❓</span>Quiz</a>
    <a href="#"><span>🗨️</span>Chat IA</a>
    <a href="perfil.html"><span>👤</span>Perfil</a>
</nav>

<script src="api.js"></script>
<script src="resultados.js"></script>

</body>
</html>
